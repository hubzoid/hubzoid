<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">One shared Hub. Three ways to put it to work.</title>
<desc id="desc">Maintain instructions, knowledge, skills, agents and tools in a Git-versioned folder. A Hub exposes authorized capabilities through team chat, workflows and personal assistants over MCP. The Admin Console controls access and shows usage and runs. Choose a supported runtime and connect your own systems.</desc>
