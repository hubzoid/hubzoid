[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hubzoid"
version = "1.1.1"
description = "An open-source framework for production AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "HubZoid", email = "hello@hubzoid.com" }]
maintainers = [{ name = "HubZoid", email = "hello@hubzoid.com" }]
keywords = [
  "agents",
  "ai",
  "llm",
  "openai",
  "anthropic",
  "claude",
  "openrouter",
  "markdown",
  "agents.md",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Everything needed to run `hubzoid run <hub>`, web app included, is a required
# dependency: `pip install hubzoid` is enough. The Open WebUI chat app is an
# optional extra (Open WebUI mode, HUBZOID_UI=openwebui): pip install "hubzoid[openwebui]".
dependencies = [
  # Bounds: lower = the version this release was tested with; upper = the next
  # release line that may break us (next minor for 0.x packages, next major
  # otherwise).
  "openai-agents[litellm]>=0.17.3,<0.18",  # 0.18+ needs openai>=2.36 (see the openai cap below)
  "litellm>=1.95.0,<1.96",  # model routing, reviewed per bump. 1.95.0 has no macOS wheels (it builds Rust); 1.95.1 has them and needs aiohttp>=3.14.2
  "claude-agent-sdk>=0.2.159,<0.3",
  "fastmcp>=3.4.7,<4",    # mcp_server.py hosted MCP endpoint (Streamable HTTP)
  "starlette>=0.47,<2",     # edge.py reverse-proxy app
  "websockets>=15,<18",     # edge.py websocket passthrough (legacy Open WebUI mode)
  "PyYAML>=6.0.3,<7",
  "python-dotenv>=1.2,<2",
  "composio>=0.15,<0.16",  # connections.py broker. 0.16+ needs openai>=2.42 (connected_accounts / auth_configs / link)
  "opentelemetry-proto>=1.44,<2",  # otel.py in-bridge OTLP normalize intercept parses/rewrites ExportTraceServiceRequest protobufs
  "typer>=0.27,<1",
  "jinja2>=3.1.6,<4",
  "slack-bolt>=1.30,<2",
  "casbin>=1.43,<2",        # access/store.py: per-hub authorization (RBAC-with-domains, direct grants) behind can()
  "dbos==3.1.0",           # workflows/: durable workflow engine, embedded (SQLite default, Postgres via DATABASE_URL). Exact pin: owner-loss recovery relies on its outcome handling (see AGENTS.md before upgrading)
  "croniter>=6.2,<7",       # workflows/: evaluate a workflow's cron in its own timezone (DST-safe dispatcher)
  "pwdlib[argon2,bcrypt]>=0.3.1,<0.4",  # hubzoid.auth: argon2 password hashes; verifies bcrypt hashes moved from Open WebUI
  "python-multipart>=0.0.32,<0.1",  # FastAPI form and file uploads (chat attachments, sign-in forms)

  # Open WebUI caps: the shared dependencies the `openwebui` extra needs.
  # open-webui 0.11.4 pins these shared dependencies exactly. While it was a
  # required dependency, every install got those versions, and they are the set
  # Hubzoid is tested with. The core install keeps their release lines for this
  # release, so `pip install hubzoid` resolves to the tested set with or without
  # the extra. Without them a fresh install drifts: openai 2.54 breaks
  # openai-agents 0.17's usage accounting on every run and tool call.
  # One exception: aiohttp (pinned 3.13.5 by open-webui) is left to litellm.
  # Capping it forces litellm 1.95.0, which has no macOS wheels and compiles
  # Rust for minutes on every Mac install; 1.95.1 ships wheels and needs 3.14.
  "openai>=2.29.0,<2.30",   # via openai-agents, litellm and composio
  "mcp>=1.27.2,<1.28",      # via fastmcp, claude-agent-sdk and openai-agents
  "tiktoken>=0.13,<0.14",   # via litellm
  "fastapi>=0.136.3,<0.137",
  "uvicorn[standard]>=0.51,<0.52",
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.13.4,<2.14",
  "cryptography>=48,<49",   # secretbox.py deployment key (Fernet); access/owui_oauth_tokens.py decrypts OWUI's per-user tool tokens (same scheme)
  "rich>=13.9,<14",         # httpx[cli] (via open-webui) caps rich below 14
  "pypdf>=6.7.5,<6.8",
  "Pillow>=12.2,<12.3",     # vision_inject.py resizes uploaded images before sending them to the model
  "SQLAlchemy>=2.0.50,<2.1",  # db.py: hub-owned tables. SQLite default; Postgres via DATABASE_URL
  "alembic>=1.18.4,<1.19",  # migrations/: versioned schema for Hubzoid's own tables
  "boto3>=1.42.62,<1.43",   # config_secrets.py: optional AWS Secrets Manager layers, imported only when a secret is named
  "authlib>=1.7.2,<1.8",    # hubzoid.auth, hubzoid.connectors: OAuth 2.0 and OpenID Connect clients (Google, Microsoft, OIDC, MCP servers)
  "itsdangerous>=2.2,<2.3", # signed, short-lived state for sign-in and connection flows
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]  # only when DATABASE_URL points at Postgres
# Legacy chat app for one release (HUBZOID_UI=openwebui), removed in the next
# minor. PINNED: per-user MCP OAuth and branding patches couple to Open WebUI
# internals, so upgrades are deliberate. Re-run tests/ and HubzoidTests before
# bumping. Its own dependencies (PyTorch, PyAV and many more) make it large.
openwebui = ["open-webui==0.11.4"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-split>=0.10",    # CI spreads the suite over several machines (.test_durations)
  "pytest-timeout>=2.3",   # a hung test fails on its own instead of stalling CI
  "setuptools>=68",  # tests/test_packaging.py runs the build's own package discovery
  "build>=1.2",
  "twine>=5.0",
  "reportlab>=4.0",
]

[project.scripts]
hubzoid = "hubzoid.cli:app"

[project.urls]
Homepage = "https://github.com/hubzoid/hubzoid"
Repository = "https://github.com/hubzoid/hubzoid"
Issues = "https://github.com/hubzoid/hubzoid/issues"
Changelog = "https://github.com/hubzoid/hubzoid/releases"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE", "NOTICE"]

# Every package under hubzoid/ ships (1.0.1 shipped a wheel without two of them
# when this was a hand-kept list). Directories without __init__.py are data
# (migration versions, hub templates, the built web app) and ship through
# package-data below. tests/test_packaging.py fails when a directory holding
# Python modules is neither.
[tool.setuptools.packages.find]
include = ["hubzoid", "hubzoid.*"]
namespaces = false

[tool.setuptools.package-data]
hubzoid = ["templates/**/*", "templates/**/.*", "core_assets/**/*", "core_assets/**/.*", "portal_dist/**/*", "migrations/*/versions/*.py", "migrations/*/script.py.mako"]

# Bytecode that tests or a local run leave next to a template's tools never ships.
[tool.setuptools.exclude-package-data]
hubzoid = ["*.pyc", "**/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast by default; CI and release checks run everything with `-m ""`.
addopts = "-m 'not (slow or heavy or e2e or e2e_llm or e2e_ui or e2e_browser)'"
# No test takes a minute. A test still running after two is stopped and
# reported as skipped (tests/conftest.py), so a hang never blocks CI; only real
# failures do.
timeout = 120
timeout_method = "signal"
markers = [
  "heavy: took 5 s or more (.test_durations); CI leaves these out, run with -m heavy",
  "slow: starts DBOS, Postgres, the gateway or another process (seconds per test)",
  "e2e: end-to-end test that calls a real LLM (uses claude-local subscription credit or OpenRouter)",
  "e2e_llm: end-to-end test that calls a real LLM (uses claude-local subscription credit)",
  "e2e_ui: end-to-end test that drives Open WebUI in a real browser via Playwright",
  "e2e_browser: end-to-end test that spawns the shared playwright-mcp sidecar and drives a real browser (needs Node/npx; pooled-mode cases also need Docker)",
]
