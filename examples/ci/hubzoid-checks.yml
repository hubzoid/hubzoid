# Hubzoid checks for a hub repository. Copy to .github/workflows/hubzoid-checks.yml
# and set HUB_DIR. See docs/ci.md in the Hubzoid repository.
name: hubzoid-checks

on:
  pull_request:          # no paths filter, so a required check never waits forever
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUB_DIR: .             # the hub folder (the one holding AGENTS.md)

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install hubzoid; fi

      - name: Unit tests for the hub's own code
        if: hashFiles('tests/**/*.py') != ''
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Required evals (the release gate)
        env:
          CI: "true"
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          # One of these, stored as a repository secret, never in the hub:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # A pull request from a fork gets no secrets, so the gate cannot run there.
          # It fails rather than passing unchecked: a maintainer reruns it from a
          # branch in this repository.
          if [ "$FROM_FORK" = "true" ]; then
            echo "::error::Required evals need the model credential, which forks do not get. Push the branch to this repository to run the gate."
            exit 1
          fi
          hubzoid eval run "$HUB_DIR" --required --junit eval-results.xml

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubzoid-evals
          path: |
            eval-results.xml
            ${{ env.HUB_DIR }}/.hubzoid/evals/*.json
          if-no-files-found: ignore
