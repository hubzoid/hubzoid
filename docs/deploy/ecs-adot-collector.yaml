# Example AWS Distro for OpenTelemetry (ADOT) collector config for a Hubzoid
# task on ECS, run as a sidecar container (public.ecr.aws/aws-observability/
# aws-otel-collector) with this file as its config.
#
# Point the Hubzoid container at it:
#   HUBZOID_OTEL_ENDPOINT=http://127.0.0.1:4318
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318   (for opentelemetry-instrument)
#
# Traces go to AWS X-Ray and metrics to CloudWatch (EMF). The task role needs
# xray:PutTraceSegments, xray:PutTelemetryRecords and logs:PutLogEvents.
# Audit log lines (HUBZOID_AUDIT=log) do not need this: they go to standard
# output, which the awslogs driver already sends to CloudWatch Logs.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
      grpc:
        endpoint: 127.0.0.1:4317

processors:
  batch: {}

exporters:
  awsxray: {}
  awsemf:
    namespace: Hubzoid
    log_group_name: /hubzoid/metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]
