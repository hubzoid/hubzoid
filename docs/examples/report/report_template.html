<!doctype html>
<!--
  A reusable, self-contained HTML report for hub.publish_artifact.

  Plain HTML and CSS: no scripts, no external fonts or libraries, so it renders
  inside the report viewer's sandbox (which blocks network requests) and prints
  cleanly. Fill it however you like. The example workflow next to this file
  uses Python's string.Template with these placeholders:

    $title  $subtitle  $generated  $cards  $chart  $table  $notes

  Escape every value you insert (html.escape). Nothing here is a required
  schema: copy it, change it, or publish any other HTML, PDF, CSV or image.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root {
    --ink: #1c1c1a; --muted: #5f5e59; --line: #e3e0d8; --soft: #f6f4ef;
    --accent: #2f5d8a; --good: #2e7d4f; --bad: #a3322a;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --num: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 15px/1.55 var(--font); }
  main { max-width: 960px; margin: 0 auto; padding: 40px 32px 56px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 16px; margin-bottom: 28px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); margin: 0; }
  .generated { color: var(--muted); font-size: 12px; margin-top: 8px; }
  h2 { font-size: 17px; margin: 36px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; background: var(--soft); }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font: 600 24px/1.2 var(--font); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .delta.up { color: var(--good); } .card .delta.down { color: var(--bad); }
  figure { margin: 0; }
  figure svg { width: 100%; height: auto; display: block; }
  figcaption { color: var(--muted); font-size: 12px; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead th { text-align: left; font-weight: 600; border-bottom: 2px solid var(--ink); padding: 8px 10px; }
  tbody td { border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
  tbody tr:nth-child(even) td { background: var(--soft); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--num); }
  .notes { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  @media (max-width: 600px) { main { padding: 24px 16px 40px; } h1 { font-size: 22px; } }
  @media print {
    @page { size: A4; margin: 16mm 14mm; }
    main { padding: 0; max-width: none; }
    h2 { break-after: avoid; }
    tr, .card, figure { break-inside: avoid; }
    thead { display: table-header-group; }
    tbody tr:nth-child(even) td { background: none; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>$title</h1>
    <p class="subtitle">$subtitle</p>
    <div class="generated">$generated</div>
  </header>

  <section class="cards">$cards</section>

  <h2>Trend</h2>
  <figure>$chart</figure>

  <h2>Detail</h2>
  $table

  <h2>Notes</h2>
  <div class="notes">$notes</div>

  <footer>Generated by a Hubzoid workflow. Only people this report is shared with can open it.</footer>
</main>
</body>
</html>
