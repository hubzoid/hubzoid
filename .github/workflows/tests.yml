name: tests

# Quick checks for every pull request and every push to main, a few minutes:
# the fast Python tests on SQLite without browsers, live models or Docker
# (tests of 5 s or more are `heavy` and left out, see tests/conftest.py),
# spread over two machines by .test_durations and run in parallel on each, and
# the web app's lint.
# They hold no secrets and publish nothing. The slow and end-to-end tests run
# for labeled release candidates, manual checks and published releases (ci.yml).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the core package and test tools
        run: pip install -e '.[dev]'
      - name: Every module compiles
        run: python -m compileall -q hubzoid
      - name: Fast tests, part ${{ matrix.group }} of 2 (SQLite; no browsers, live models or Docker)
        # --dist loadfile: a file's tests share one worker, so module fixtures
        # (fixed ports, one live gateway) never run twice at once.
        run: pytest -q --no-header -n auto --dist loadfile --splits 2 --group ${{ matrix.group }}

  web-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Lint the web app and Console
        working-directory: portal
        run: npm ci && npm run lint
