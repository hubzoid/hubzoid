name: release

# Release pipeline. The file keeps the name ci.yml because PyPI trusted
# publishing is registered against this workflow file name.
# Publish a GitHub release with a vX.Y.Z tag matching pyproject.toml.
# Validate the tagged source and both native image builds before publishing.
# Keep image -> PyPI -> GitHub attachments as separate, retryable jobs.
on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Tag matches the package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but pyproject says $have"; exit 1; }

      - name: Build the Console from source
        working-directory: portal
        run: npm ci && npm run lint && npm run build

      - name: Codex isolation fixture and Console journeys
        run: |
          npm install -g @openai/codex@0.147.0
          cd portal && npx playwright install --with-deps chromium && npm test

      - name: Full test suite (Open WebUI mode included)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e '.[dev,openwebui]'
          pytest -q --no-header -m ""

      - name: Build sdist and wheel
        run: python -m build

      - name: The wheel built from the sdist has the Console too
        run: |
          mkdir -p /tmp/from-sdist && python -m pip wheel --no-deps -w /tmp/from-sdist dist/*.tar.gz
          python -c "import sys,zipfile,glob; w=glob.glob('/tmp/from-sdist/*.whl')[0]; n=zipfile.ZipFile(w).namelist(); sys.exit(0 if 'hubzoid/portal_dist/index.html' in n else 'Console missing from sdist-built wheel')"

      - name: Clean install of the wheel works and serves the Console
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/pip check
          ! /tmp/clean/bin/python -c "import open_webui"
          cd /tmp && /tmp/clean/bin/python "$GITHUB_WORKSPACE/.github/scripts/verify_install.py" "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v6
        with:
          name: release-dists
          path: dist/

  image:
    # Each architecture builds and boots natively; no emulation on this path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build and load the native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: hubzoid:candidate
          cache-from: |
            type=gha,scope=release-${{ matrix.arch }}
            type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max
      - name: Check the image starts
        run: |
          cp -r demo-hub /tmp/hub && chmod -R a+rwX /tmp/hub
          printf 'MODEL=openrouter/anthropic/claude-haiku-4.5\nOPENROUTER_API_KEY=not-used\nBRIDGE_API_KEYS=ci-key\n' > /tmp/hub/.env
          # Without sign-in, the container's network bind is refused with instructions.
          set +e; docker run --rm -v /tmp/hub:/hub hubzoid:candidate; refused=$?; set -e
          test "$refused" = 2
          docker run -d --name candidate -p 3080:3080 -v /tmp/hub:/hub -e HUBZOID_AUTH=true hubzoid:candidate
          for i in $(seq 1 100); do curl -fs http://127.0.0.1:3080/healthz && break; sleep 3; done
          curl -fs http://127.0.0.1:3080/healthz
          curl -fs -o /dev/null http://127.0.0.1:3080/
          ! curl -fs -m 3 http://127.0.0.1:8000/healthz
          ! docker exec candidate python -c "import open_webui"
          docker rm -f candidate

  publish-image:
    needs: [validate, image]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hubzoid/
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish the image (amd64 + arm64) from the checked build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: |
            type=gha,scope=release-amd64
            type=gha,scope=release-arm64
            type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  publish-pypi:
    needs: publish-image
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hubzoid/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # A previous attempt may have published these before a later failure.
          skip-existing: true

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: release-dists
          path: dist/
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            # Keep existing release notes; attach the validated distributions.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            python .github/scripts/changelog_section.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
