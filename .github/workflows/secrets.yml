name: secrets

# Secret scanning with gitleaks on every push and pull request: the whole
# history (findings already dealt with are listed in .gitleaksignore) and every
# file in the current tree, so a key that is still committed at a branch's tip
# fails even when the commit that added it is older. Rules: .gitleaks.toml.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          rm "$archive"
      - name: Scan the history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: Scan the current files
        run: |
          mkdir -p /tmp/tree && git archive HEAD | tar -x -C /tmp/tree
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner --verbose /tmp/tree
