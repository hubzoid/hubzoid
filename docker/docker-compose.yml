# docker-compose for hubzoid.
#
# Mount your hub folder as a volume at /hub:
#
#   HUB_PATH=/path/to/your/hub docker compose -f docker/docker-compose.yml up
#
# Only the edge port (3080: chat UI, artifact downloads, portal, MCP) is
# published. The bridge stays on 127.0.0.1 inside the container.

services:
  hubzoid:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3080:3080"
    volumes:
      - ${HUB_PATH:-../demo-hub}:/hub
    environment:
      PORT: 3080
      BRIDGE_PORT: 8000
    restart: unless-stopped
