# docker-compose for hubzoid: one hub, SQLite (the default profile).
#
# Mount your hub folder at /hub. Its databases, chat history and runtime state
# live inside that folder (.hubzoid/), so they persist on the host and
# `hubzoid backup` covers them:
#
#   HUB_PATH=/path/to/your/hub docker compose -f docker/docker-compose.yml up -d
#
# HUB_PATH is required (an absolute path). No hub yet? Make the starter with
# the image itself, no Python needed on the host:
#   mkdir -p ~/my-hub && chmod a+rwX ~/my-hub   # the image runs as its own user
#   docker run --rm -v ~/my-hub:/hub hubzoid:local init /hub
# Or clone a ready-to-use hub (github.com/hubzoid/software-factory-hub and
# the others listed in the Hubzoid README). Put the model's credentials in the
# hub's .env: a container cannot use the claude or codex login on your laptop.
#
# The published port is reachable from other machines, so sign-in is on
# (HUBZOID_AUTH below). Before the first start, put the first administrator in
# the hub's .env, and remove both lines after it:
#   HUBZOID_ADMIN_EMAIL=you@example.com
#   HUBZOID_ADMIN_PASSWORD=<a long password>
# Behind a proxy, or for Google sign-in, also set
#   HUBZOID_PUBLIC_URL=https://hub.example.com
# The hub's .env wins over the values below.
#
# Try it without sign-in, reachable from this machine only:
#   HUB_PATH=... HUBZOID_AUTH=false HUBZOID_ALLOW_UNAUTHENTICATED_NETWORK=true \
#     HUBZOID_PUBLISH=127.0.0.1:3080 docker compose -f docker/docker-compose.yml up
#
# For PostgreSQL, add the override file (see docker-compose.postgres.yml).
#
# Only the edge port (3080: the web app, artifact downloads, MCP) is published.
# The bridge stays on 127.0.0.1 inside the container.

services:
  hubzoid:
    image: ${HUBZOID_IMAGE:-hubzoid:local}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${HUBZOID_PUBLISH:-3080}:3080"
    volumes:
      - ${HUB_PATH:?Set HUB_PATH to your hub folder, an absolute path. The top of docker/docker-compose.yml shows how to make one}:/hub
    environment:
      PORT: 3080
      BRIDGE_PORT: 8000
      HUBZOID_AUTH: ${HUBZOID_AUTH:-true}
      HUBZOID_ALLOW_UNAUTHENTICATED_NETWORK: ${HUBZOID_ALLOW_UNAUTHENTICATED_NETWORK:-false}
    restart: unless-stopped
