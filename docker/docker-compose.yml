# docker-compose for hubzoid: one hub, SQLite (the default profile).
#
# Mount your hub folder at /hub. Its databases, chat data and runtime state
# live inside that folder (.hubzoid/, .openwebui-data/), so they persist on the
# host and `hubzoid backup` covers them:
#
#   HUB_PATH=/path/to/your/hub docker compose -f docker/docker-compose.yml up -d
#
# For PostgreSQL, add the override file (see docker-compose.postgres.yml).
#
# Only the edge port (3080: chat UI, artifact downloads, portal, MCP) is
# published. The bridge stays on 127.0.0.1 inside the container.

services:
  hubzoid:
    image: ${HUBZOID_IMAGE:-hubzoid:local}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${HUBZOID_PUBLISH:-3080}:3080"
    volumes:
      - ${HUB_PATH:-../demo-hub}:/hub
    environment:
      PORT: 3080
      BRIDGE_PORT: 8000
    restart: unless-stopped
